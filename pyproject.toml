[project]
name = "fundrive-quark"
version = "1.0.3"
description = "fundrive-quark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "funutil>=1.0.46",]
[[project.authors]]
name = "niuliangtao"
email = "farfarfun@qq.com"

[tool.setuptools]
license-files = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
